name: Capture RiskCrest submission screenshots (one-time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-riskcrest-screenshots.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and screenshot dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify secure and vulnerable application tests
        run: python -m pytest -q
      - name: Capture screenshots from real local browser sessions
        run: python -m scripts.capture_screenshots
      - name: Publish screenshot evidence and remove one-off workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          file = Path('README.md')
          text = file.read_text(encoding='utf-8')
          old = 'The project report and submission-specific screenshots are maintained separately from the runnable code repository.'
          new = ('The project report is submitted separately. Actual browser screenshots of both apps, '
                 'captured from synthetic demo accounts, are available in '
                 '[docs/screenshots/](docs/screenshots/).')
          if old not in text:
              raise SystemExit('README section changed; refusing unverified edit')
          file.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots README.md
          git rm .github/workflows/capture-riskcrest-screenshots.yml
          git commit -m "Add verified RiskCrest website screenshots"
          git push origin HEAD:main
